<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Timezone Digital Clock</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 Global Digital Clock</h1>
            <p>Current time across different time zones</p>
        </header>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search timezone..." class="search-box">
            <select id="themeToggle" class="theme-toggle">
                <option value="dark">Dark Mode</option>
                <option value="light">Light Mode</option>
            </select>
        </div>

        <div class="clock-grid" id="clockGrid">
            <!-- Clocks will be inserted here by JavaScript -->
        </div>

        <footer>
            <p>Last updated: <span id="lastUpdated">--:--:--</span></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
