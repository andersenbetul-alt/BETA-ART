<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#080808"/>
  <!-- Subtle noise texture via pattern -->
  <defs>
    <pattern id="noise" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#080808"/>
      <rect x="0" y="0" width="1" height="1" fill="#111" opacity="0.5"/>
      <rect x="2" y="2" width="1" height="1" fill="#111" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#noise)"/>
  <!-- Top label -->
  <text x="80" y="100" font-family="'Courier New', monospace" font-size="14" fill="#555" letter-spacing="4">UTGAVE 01 · OSLO / NORWAY</text>
  <!-- Main HXI mark -->
  <text x="80" y="380" font-family="Arial Black, Impact, sans-serif" font-size="320" font-weight="900" fill="#F0EDE8" letter-spacing="-8">H</text>
  <text x="430" y="380" font-family="Arial Black, Impact, sans-serif" font-size="320" font-weight="900" fill="#C8FF00" letter-spacing="-8">X</text>
  <text x="770" y="380" font-family="Arial Black, Impact, sans-serif" font-size="320" font-weight="900" fill="#F0EDE8" letter-spacing="-8">I</text>
  <!-- Tagline -->
  <text x="80" y="470" font-family="Arial Black, Impact, sans-serif" font-size="32" font-weight="900" fill="#F0EDE8" letter-spacing="3">THE SAME SPEED — COLDER.</text>
  <!-- Coordinates -->
  <text x="80" y="570" font-family="'Courier New', monospace" font-size="14" fill="#555" letter-spacing="2">59.91°N · 10.75°E</text>
  <!-- Domain -->
  <text x="1120" y="570" font-family="'Courier New', monospace" font-size="14" fill="#555" letter-spacing="2" text-anchor="end">HXI.NO</text>
</svg>
