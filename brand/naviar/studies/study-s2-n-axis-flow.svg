  <!-- Gold sweep: diagonal blade + full upper-right notch merged into one flowing gold shape -->
  <!-- Traces: left-stem-top → right-stem-top → outer-right mid-point → diagonal lower-right → diagonal lower-left -->
  <path d="M150,0 H760 V428.7 L610,626.97 L150,173.03 Z" fill="#D4AF37"/>
</svg>
