<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" role="img" aria-label="Beta Art">
  <title>Beta Art</title>
  <!-- Mark — centred at (40,40), scaled to 80×80 viewport -->
  <g transform="translate(40,40) scale(0.35)">
    <circle cx="0" cy="0" r="44" stroke="#111010" stroke-width="3"/>
    <!-- Aperture blades translated so centre = 0,0 -->
    <line x1="-23.2" y1="37.4" x2="37.4" y2="-23.2" stroke="#111010" stroke-width="2.2"/>
    <line x1="-37.4" y1="23.2" x2="23.2" y2="-37.4" stroke="#111010" stroke-width="2.2"/>
    <line x1="-37.4" y1="-23.2" x2="23.2" y2="37.4" stroke="#111010" stroke-width="2.2"/>
    <line x1="-23.2" y1="-37.4" x2="37.4" y2="23.2" stroke="#111010" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="5" fill="#8B1515"/>
  </g>
  <!-- Wordmark — "BETA ART" -->
  <text
    x="84" y="36"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="22"
    font-weight="700"
    letter-spacing="3"
    fill="#111010"
    dominant-baseline="auto">BETA ART</text>
  <!-- Tagline — "VERIFIED HUMAN PHOTOGRAPHY" -->
  <text
    x="85" y="56"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="9"
    font-weight="400"
    letter-spacing="2.5"
    fill="#555050"
    dominant-baseline="auto">VERIFIED HUMAN PHOTOGRAPHY</text>
</svg>
