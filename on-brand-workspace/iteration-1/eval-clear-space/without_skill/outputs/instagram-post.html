<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>NAVIAR — Instagram Duyuru Postu</title>
<style>
  html,body{margin:0;padding:0;background:#3a3a3a;}
  .stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px;box-sizing:border-box;}
  .canvas{
    position:relative;
    width:1080px;
    height:1080px;
    background:#0A1628;
    overflow:hidden;
    font-family:'Helvetica Neue',Arial,sans-serif;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  /* Logo crammed into the top-left corner, flush to both edges — no clear space */
  .logo-corner{
    position:absolute;
    top:0;
    left:0;
    width:340px;
    height:auto;
    z-index:2;
  }
  .logo-corner svg{ display:block; width:100%; height:auto; }

  /* Headline positioned so it runs directly into / overlaps the logo edge */
  .headline{
    position:absolute;
    top:58px;
    left:250px; /* overlaps the logo's right edge (logo is 340px wide) by 90px */
    right:60px;
    z-index:3;
    color:#F5F6F8;
    font-weight:800;
    font-size:86px;
    line-height:0.98;
    letter-spacing:-0.01em;
  }
  .headline .gold{ color:#D4AF37; }

  .kicker{
    position:absolute;
    top:18px;
    left:250px;
    z-index:3;
    color:#D4AF37;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.22em;
    text-transform:uppercase;
  }

  .sub{
    position:absolute;
    top:400px;
    left:80px;
    right:80px;
    z-index:2;
    color:#C9CDD6;
    font-weight:400;
    font-size:32px;
    line-height:1.45;
    max-width:820px;
  }

  .divider{
    position:absolute;
    top:520px;
    left:80px;
    width:120px;
    height:4px;
    background:#D4AF37;
  }

  .details{
    position:absolute;
    top:580px;
    left:80px;
    right:80px;
    z-index:2;
    color:#F5F6F8;
    font-size:28px;
    line-height:1.9;
  }
  .details b{ color:#D4AF37; font-weight:700; }

  .cta{
    position:absolute;
    bottom:90px;
    left:80px;
    background:#D4AF37;
    color:#0A1628;
    font-weight:800;
    font-size:30px;
    padding:22px 46px;
    border-radius:6px;
    letter-spacing:0.02em;
  }

  .handle{
    position:absolute;
    bottom:100px;
    right:80px;
    color:#8B93A3;
    font-size:24px;
    letter-spacing:0.05em;
  }

  .bg-shape{
    position:absolute;
    right:-160px;
    bottom:-160px;
    width:640px;
    height:640px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(212,175,55,0.16), rgba(212,175,55,0) 65%);
    z-index:1;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="canvas" data-canvas-width="1080" data-canvas-height="1080">

    <div class="bg-shape"></div>

    <!-- Logo: cornered flush, zero clear space, per brief -->
    <div class="logo-corner">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760.0 800.0" role="img" aria-label="NAVIAR N monogram">
        <path d="M0 0 H150.0 L610.0 626.97 V167.7 L760.0 428.7 V800.0 H610.0 L150.0 173.03 V800.0 H0 Z" fill="#F5F6F8"/>
        <path d="M610.0 0 H760.0 V428.7 L610.0 167.7 Z" fill="#D4AF37"/>
      </svg>
    </div>

    <div class="kicker">Duyuru</div>

    <!-- Headline text runs directly into the logo's edge -->
    <div class="headline">BÜYÜK BİR<br><span class="gold">ADIM</span> ATIYORUZ</div>

    <div class="sub">NAVIAR'da yeni bir dönem başlıyor. Ekibimizin aylardır üzerinde çalıştığı yeniliği önümüzdeki hafta sizlerle paylaşıyoruz.</div>

    <div class="divider"></div>

    <div class="details">
      <b>Tarih:</b> 8 Eylül 2026<br>
      <b>Saat:</b> 19:00<br>
      <b>Yer:</b> Canlı yayın — bağlantı bio'da
    </div>

    <div class="cta">Hatırlatıcı kur →</div>
    <div class="handle">@naviar</div>

  </div>
</div>
</body>
</html>
