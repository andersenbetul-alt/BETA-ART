<title>QBLOGG Teklif Sunumu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f6f7fb;
    --bg-card: #ffffff;
    --text: #14161c;
    --text-muted: #5b6172;
    --border: #e3e6ee;
    --brand: #082C54;
    --brand-2: #00D8C2;
    --brand-2-ink: #0a7d72;
    --brand-soft: rgba(8, 44, 84, .08);
    --on-brand: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0e14;
      --bg-soft: #12141c;
      --bg-card: #151823;
      --text: #eef0f6;
      --text-muted: #9ea5b9;
      --border: #262b3a;
      --brand: #00D8C2;
      --brand-2: #7ce9dd;
      --brand-2-ink: #7ce9dd;
      --brand-soft: rgba(0, 216, 194, .13);
      --on-brand: #08262b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0e14;
    --bg-soft: #12141c;
    --bg-card: #151823;
    --text: #eef0f6;
    --text-muted: #9ea5b9;
    --border: #262b3a;
    --brand: #00D8C2;
    --brand-2: #7ce9dd;
    --brand-2-ink: #7ce9dd;
    --brand-soft: rgba(0, 216, 194, .13);
    --on-brand: #08262b;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: clamp(.95rem, 1.4vw, 1.1rem);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .deck { min-height: 100vh; display: flex; flex-direction: column; }

  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
  }
  .q-mark { width: 30px; height: 30px; flex: none; }
  .q-mark .ring { fill: var(--brand); }
  :root[data-theme="dark"] .q-mark .ring { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .q-mark .ring { fill: #ffffff; }
  }
  .q-mark .tail { fill: #00D8C2; }
  .wordmark { font-weight: 800; letter-spacing: -.03em; font-size: 1.05rem; }
  .langs { margin-inline-start: auto; display: flex; gap: 6px; }
  .langs button {
    font: inherit; font-size: .78rem; font-weight: 700;
    letter-spacing: .06em;
    background: transparent; color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 12px; cursor: pointer;
  }
  .langs button:hover { background: var(--bg-soft); color: var(--text); }
  .langs button[aria-pressed="true"] {
    background: var(--brand); color: var(--on-brand); border-color: var(--brand);
  }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; border-radius: 6px; }

  .stage { flex: 1; display: grid; }
  .slide {
    grid-area: 1 / 1;
    display: none;
    padding: clamp(28px, 5vw, 64px);
    max-width: 1060px;
    width: 100%;
    margin-inline: auto;
  }
  .slide.on { display: block; }

  .eyebrow {
    display: block;
    font-size: .78rem; font-weight: 700;
    letter-spacing: .13em; text-transform: uppercase;
    color: var(--brand-2-ink);
    margin-bottom: 10px;
  }
  h1 {
    margin: 0 0 14px;
    font-size: clamp(1.7rem, 4.4vw, 2.9rem);
    font-weight: 800; letter-spacing: -.03em; line-height: 1.12;
    text-wrap: balance;
  }
  h2 {
    margin: 0 0 18px;
    font-size: clamp(1.4rem, 3.2vw, 2.1rem);
    font-weight: 800; letter-spacing: -.025em;
    text-wrap: balance;
  }
  p.lead { font-size: clamp(1rem, 1.8vw, 1.22rem); color: var(--text-muted); max-width: 62ch; margin: 0 0 10px; }
  .muted { color: var(--text-muted); }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-top: 24px; }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
  }
  .card h3 { margin: 0 0 8px; font-size: 1.02rem; font-weight: 700; }
  .card p { margin: 0; color: var(--text-muted); font-size: .92rem; }
  .card .big {
    display: block;
    font-size: clamp(1.4rem, 2.6vw, 1.9rem);
    font-weight: 800; letter-spacing: -.02em;
    color: var(--brand);
    font-variant-numeric: tabular-nums;
    margin-bottom: 4px;
  }

  .flowline { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
  .chip {
    background: var(--brand-soft); color: var(--brand);
    border-radius: 999px; padding: 7px 15px;
    font-size: .86rem; font-weight: 600;
  }

  .draftflag {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--brand-soft);
    color: var(--brand);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: .78rem; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase;
    margin-bottom: 18px;
  }
  .draftflag .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand-2); }

  table { border-collapse: collapse; width: 100%; font-size: .94rem; margin-top: 8px; }
  .table-scroll { overflow-x: auto; }
  th, td { text-align: start; padding: 11px 14px; border-bottom: 1px solid var(--border); }
  th { font-size: .74rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
  td:last-child { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }

  ul.big-list { margin: 20px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; }
  ul.big-list li {
    display: flex; gap: 14px; align-items: baseline;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px; padding: 15px 18px;
    font-size: .98rem;
  }
  ul.big-list .tick { flex: none; width: 17px; height: 17px; color: var(--brand-2-ink); transform: translateY(2px); }
  .fillme { border-style: dashed !important; }
  .fillme .ph { color: var(--brand-2-ink); font-weight: 700; }

  .navbar {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 22px;
    border-top: 1px solid var(--border);
  }
  .navbar button {
    font: inherit; font-weight: 700; font-size: .9rem;
    background: var(--bg-soft); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 18px; cursor: pointer;
  }
  .navbar button:hover { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
  .counter { margin-inline-start: auto; color: var(--text-muted); font-size: .84rem; font-variant-numeric: tabular-nums; }
  .hint { color: var(--text-muted); font-size: .78rem; }
  @media (max-width: 620px) { .hint { display: none; } }
</style>

</div>

let lang = 'tr', idx = 0;
try { const v = localStorage.getItem('qb-offer-lang'); if (v && I18N[v]) lang = v; } catch (e) {}

const stage = document.getElementById('stage');
const counter = document.getElementById('counter');

function render() {
  const t = I18N[lang];
  const list = slides(t);
  stage.innerHTML = list.map((html, i) =>
    `<section class="slide${i === idx ? ' on' : ''}" aria-hidden="${i !== idx}">${html}</section>`).join('');
  counter.textContent = (idx + 1) + ' / ' + list.length;
  document.querySelector('.hint').textContent = t.hint;
  document.querySelectorAll('.langs button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  document.documentElement.lang = lang === 'no' ? 'nb' : lang;
}

function go(d) {
  const n = slides(I18N[lang]).length;
  idx = Math.min(n - 1, Math.max(0, idx + d));
  render();
}

document.getElementById('prev').addEventListener('click', () => go(-1));
document.getElementById('next').addEventListener('click', () => go(1));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
});
document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('qb-offer-lang', lang); } catch (e) {}
  render();
}));
render();
</script>
