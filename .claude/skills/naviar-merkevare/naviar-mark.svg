<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Naviar">
  <!-- Varden fra A-en i ordmerket. Én flate med bandet som hull, ikke to flater
       der den ene ligger gjennomsiktig oppå den andre: gjennomsiktighet finnes
       ikke i ett trykkfarge, og ved 16 px blir 45 % opasitet en grå klump i
       stedet for en strek. Tegnet som flater og ikke streker av samme grunn –
       en hårstrek på 1 px forsvinner der en flate holder. -->
  <path fill="currentColor" fill-rule="evenodd" d="M16 3.2 3.4 28.8h5.1L16 13.6l7.5 15.2h5.1L16 3.2ZM11.1 23.6h9.8l2.2 4.4H8.9l2.2-4.4Z"/>
</svg>
