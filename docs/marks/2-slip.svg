<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <rect width="100" height="100" fill="#08080f"/>
  <!-- H X I read as a motion diagram: two uprights, the crossing, and the exit stroke
       that has stepped off the baseline — the rear of the car coming round. -->
  <g fill="#f2f2f5">
    <rect x="18" y="26" width="10" height="48"/>
    <rect x="38" y="26" width="10" height="48"/>
    <rect x="18" y="45" width="30" height="10"/>
  </g>
  <g stroke="#f2f2f5" stroke-width="10"><line x1="58" y1="30" x2="76" y2="70"/></g>
  <g stroke="#ef2b2d" stroke-width="10"><line x1="78" y1="30" x2="60" y2="70"/></g>
  <rect x="84" y="34" width="10" height="48" fill="#f2f2f5"/>
</svg>
