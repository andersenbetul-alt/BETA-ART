<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <rect width="100" height="100" fill="#08080f"/>
  <!-- The racing line: two arcs crossing at the apex. An X built from the path through
       a corner rather than from two straight strokes. -->
  <g fill="none" stroke="#f2f2f5" stroke-width="10" stroke-linecap="butt">
    <path d="M22 22 C 46 40, 54 60, 78 78"/>
    <path d="M78 22 C 54 40, 46 60, 22 78"/>
  </g>
  <circle cx="50" cy="50" r="4.6" fill="#ef2b2d"/>
</svg>
