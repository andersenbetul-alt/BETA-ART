<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Beta Art">
  <title>Beta Art</title>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="44" stroke="#111010" stroke-width="3"/>
  <!-- Aperture blades — four chord lines, each offset 10 units from centre -->
  <!-- Pair A: slope -1, c = 114.14 and 85.86 -->
  <line x1="26.8" y1="87.4" x2="87.4" y2="26.8" stroke="#111010" stroke-width="2.2"/>
  <line x1="12.6" y1="73.2" x2="73.2" y2="12.6" stroke="#111010" stroke-width="2.2"/>
  <!-- Pair B: slope +1, c = 14.14 and -14.14 -->
  <line x1="12.6" y1="26.8" x2="73.2" y2="87.4" stroke="#111010" stroke-width="2.2"/>
  <line x1="26.8" y1="12.6" x2="87.4" y2="73.2" stroke="#111010" stroke-width="2.2"/>
  <!-- Centre dot — crimson, 5 px radius -->
  <circle cx="50" cy="50" r="5" fill="#8B1515"/>
</svg>
