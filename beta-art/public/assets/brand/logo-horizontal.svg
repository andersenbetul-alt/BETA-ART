<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 120" role="img" aria-label="Beta Art">
  <title>Beta Art</title>
  <!-- Ground -->
  <rect width="380" height="120" fill="#0A0908"/>
  <!-- BA mark (scaled ~0.55, centred at 60,60) -->
  <g transform="translate(60,60) scale(0.55)">
    <line x1="-68" y1="-58" x2="-68" y2="58"
          stroke="#C4A35A" stroke-width="4" stroke-linecap="round"/>
    <path d="M -68,-58 Q -22,-58 -22,-29 Q -22,0 -68,0"
          stroke="#C4A35A" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M -68,0 Q -16,0 -16,29 Q -16,58 -68,58"
          stroke="#C4A35A" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <line x1="34" y1="-58" x2="-3" y2="58"
          stroke="#C4A35A" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="34" y1="-58" x2="72" y2="58"
          stroke="#C4A35A" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="13" y1="12" x2="55" y2="12"
          stroke="#C4A35A" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="118" y="50"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="26" font-weight="700" letter-spacing="5"
        fill="#F2EFE8">BETA ART</text>
  <!-- Tagline -->
  <text x="120" y="74"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="8.5" font-weight="300" letter-spacing="3"
        fill="#8A8680">PHOTOGRAPHY ARCHIVE</text>
  <!-- Hairline rule -->
  <line x1="118" y1="82" x2="340" y2="82"
        stroke="#C4A35A" stroke-width="0.6" opacity="0.5"/>
  <!-- Sub-tagline -->
  <text x="120" y="95"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="7" font-weight="300" letter-spacing="2.5"
        fill="#55504A">TRUST EACH IMAGE</text>
</svg>
