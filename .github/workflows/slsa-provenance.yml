# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow generates a SLSA provenance file for the QBLOGG site bundle.
# The generation satisfies level 3 for the provenance requirements - see https://slsa.dev/spec/v0.1/requirements
# The project is an initiative of the OpenSSF (openssf.org) and is developed at
# https://github.com/slsa-framework/slsa-github-generator.
# The provenance file can be verified using https://github.com/slsa-framework/slsa-verifier.
# For more information about SLSA and how it improves the supply-chain, visit slsa.dev.

name: SLSA generic generator
on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # QBLOGG has no compile step by design (see CLAUDE.md): the
      # "build" is packaging the exact file set the Vercel deploy
      # recipe (vercel.json → buildCommand) copies into dist/, after
      # the same health check that gates a commit.
      - name: Check site health
        run: node scripts/check.mjs

      - name: Build artifact — site bundle
        run: |
          set -euo pipefail
          mkdir -p dist/.well-known dist/demo
          cp index.html work.html blog.html post.html gizlilik.html \
             kosullar.html kalite.html ornek.html 404.html \
             sitemap.xml robots.txt feed.xml dist/
          cp .well-known/security.txt dist/.well-known/
          cp demo/cv-action-page.html demo/cv-action-page.js dist/demo/
          cp -r assets dist/assets
          tar -czf qblogg-site.tar.gz -C dist .

      # ========================================================
      #
      # Generate the provenance subject: the sha256 of the site
      # bundle tarball produced above.
      #
      # ========================================================
      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail

          # List the artifacts the provenance will refer to.
          files=$(ls qblogg-site.tar.gz)
          # Generate the subjects (base64 encoded).
          echo "hashes=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}"

  provenance:
    needs: [build]
    permissions:
      actions: read   # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.4.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true # Optional: Upload to a new release
