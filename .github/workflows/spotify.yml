name: spotify

# Pulls the artist's public Spotify data into assets/data/spotify.json once a week.
# Needs two repository secrets from https://developer.spotify.com/dashboard:
#   SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET
on:
  schedule:
    - cron: '17 6 * * 1'     # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-spotify.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      - run: npm run check
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain assets/data/spotify.json)" ]; then
            git config user.name  "spotify-sync"
            git config user.email "actions@users.noreply.github.com"
            git add assets/data/spotify.json
            git commit -m "Sync Spotify data"
            git push
          else
            echo "Nothing to commit."
          fi
